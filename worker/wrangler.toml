name = "workbench-chat-proxy"
main = "index.ts"
compatibility_date = "2026-10-21"
compatibility_flags = ["enable_request_signal"]

[vars]
ALLOWED_ORIGIN = "https://hodovani.github.io"

[[d1_databases]]
binding = "METRICS_DB"
database_name = "workbench-chat-metrics"
migrations_dir = "migrations"

[[ratelimits]]
name = "METRICS_LIMIT"
namespace_id = "41725"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["17 0 * * *"]
