name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.ci-report.outputs.markdown }}
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint and check
        id: lint
        run: pnpm lint && false

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Check for unused exports and files
        run: pnpm knip

      - name: Test with coverage thresholds
        id: coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm coverage

      - name: Chat browser regression tests
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          pnpm test:e2e

      - name: Compile-time contract tests
        id: type-tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:types

      - name: Worker protocol tests
        run: pnpm test:worker

      - name: Firestore rules and repository integration tests
        run: pnpm test:integration

      - name: Check Worker bundle
        run: pnpm worker:check

      - name: Build static site
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_CHAT_API_URL: ${{ vars.NEXT_PUBLIC_CHAT_API_URL }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Summarize PR checks
        id: ci-report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CHECKOUT_STATUS: ${{ steps.checkout.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          COVERAGE_STATUS: ${{ steps.coverage.outcome }}
          TYPE_TEST_STATUS: ${{ steps.type-tests.outcome }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$CHECKOUT_STATUS" == success ]]; then
            report=$(node scripts/ci-report.mjs coverage/coverage-summary.json)
          else
            report=$(printf '## CI report\n\nChecks were skipped because checkout did not succeed.\n\n[Workflow run](%s)' "$CI_RUN_URL")
          fi
          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          delimiter=$(uuidgen)
          printf 'markdown<<%s\n%s\n%s\n' "$delimiter" "$report" "$delimiter" >> "$GITHUB_OUTPUT"

  comment:
    name: Publish PR report
    needs: build
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' &&
          needs.build.outputs.report != '' }}
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Update CI report comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_REPORT: ${{ needs.build.outputs.report }}
        run: |
          comment_ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- workbench-ci-report -->"))) | .id')
          comment_id=${comment_ids%%$'\n'*}
          body=$(printf '<!-- workbench-ci-report -->\n%s\n' "$CI_REPORT")
          if [[ -n "$comment_id" ]]; then
            gh api --silent --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body"
          else
            gh api --silent --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
